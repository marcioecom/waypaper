name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "marketing=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build DMG and ZIP
        env:
          WAYPAPER_VERSION: ${{ steps.version.outputs.marketing }}
          WAYPAPER_BUILD: ${{ github.run_number }}
        run: python3 scripts/package.py

      - name: Smoke test (graphical session)
        run: |
          demo="$(mktemp -t waypaper-ci).mp4"
          ffmpeg -y -loglevel error \
            -f lavfi -i "testsrc2=size=960x540:rate=30:duration=8" \
            -f lavfi -i "sine=frequency=440:duration=8" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$demo"
          # Bundle.module falls back to this compile-time path, which exists on the
          # runner and hides the crash users hit. Hide it so launch must use Contents/Resources.
          hidden=()
          while IFS= read -r bundle; do
            mv "$bundle" "${bundle}.hidden-for-smoke"
            hidden+=("$bundle")
          done < <(find .build -type d -name 'Waypaper_Waypaper.bundle')
          test "${#hidden[@]}" -gt 0
          trap 'for bundle in "${hidden[@]}"; do mv "${bundle}.hidden-for-smoke" "$bundle"; done' EXIT
          dist/Waypaper.app/Contents/MacOS/Waypaper --smoke-test "$demo" -AppleLanguages '(pt-BR)'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Waypaper ${{ steps.version.outputs.marketing }} (Apple Silicon, macOS 13+)
          generate_release_notes: false
          body: |
            Waypaper turns your videos into animated wallpapers on macOS. Local library, per-display playback, no account and no cloud.

            Requires **macOS 13 or later** on **Apple Silicon (M1 and later)**. Intel Macs are not supported.

            **Install:** download `Waypaper.dmg`, open it, and drag **Waypaper** to Applications.

            **First launch:** this build is ad hoc signed and not notarized. If macOS blocks the app, open **System Settings → Privacy & Security** and click **Open Anyway**. Do not disable Gatekeeper.

            The interface follows the Mac language: **English** or **Brazilian Portuguese**. **Open at login** is in the library sidebar.
          files: |
            dist/Waypaper.dmg
            dist/Waypaper.zip
