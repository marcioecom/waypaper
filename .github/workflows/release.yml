name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "marketing=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build DMG and ZIP
        env:
          WAYPAPER_VERSION: ${{ steps.version.outputs.marketing }}
          WAYPAPER_BUILD: ${{ github.run_number }}
        run: python3 scripts/package.py

      - name: Smoke test (graphical session)
        run: |
          demo="$(mktemp -t waypaper-ci).mp4"
          ffmpeg -y -loglevel error \
            -f lavfi -i "testsrc2=size=960x540:rate=30:duration=8" \
            -f lavfi -i "sine=frequency=440:duration=8" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$demo"
          dist/Waypaper.app/Contents/MacOS/Waypaper --smoke-test "$demo"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Waypaper.dmg
            dist/Waypaper.zip
